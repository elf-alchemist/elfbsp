name: Continuous Integration

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    tags: ["*"]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux Clang x86_64
            os: ubuntu-latest
            shell: bash
            package_name: linux_clang_x86_64
            artifact_path: build/*.zip
            install: |
              sudo apt-get update
              sudo apt-get install -y \
                clang \
                lld \
                libc++-dev \
                libc++abi-dev \
                ninja-build
            configure: |
              -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DENABLE_STATIC=ON \
              -DENABLE_HARDENING=ON \
              -DENABLE_LTO=ON

          - name: Linux GCC x86_64
            os: ubuntu-latest
            shell: bash
            package_name: linux_gcc_x86_64
            artifact_path: build/*.zip
            install: |
              sudo apt-get update
              sudo apt-get install -y ninja-build
            configure: |
              -G Ninja \
              -DCMAKE_C_COMPILER=gcc \
              -DCMAKE_CXX_COMPILER=g++ \
              -DENABLE_STATIC=ON \
              -DENABLE_HARDENING=ON \
              -DENABLE_LTO=ON

          - name: MacOS Clang ARM64
            os: macos-latest
            shell: bash
            package_name: macos_clang_arm64
            artifact_path: build/*.zip
            install: |
              brew install ninja
            configure: |
              -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DCMAKE_OSX_ARCHITECTURES="arm64" \
              -DENABLE_HARDENING=ON \
              -DENABLE_LTO=ON

          - name: Windows MSYS2 Clang x86_64
            os: windows-latest
            shell: "msys2 {0}"
            msystem: clang64
            package_name: windows_clang_x86_64
            artifact_path: build/*.zip
            msys2_packages: >-
              mingw-w64-clang-x86_64-clang
              mingw-w64-clang-x86_64-lld
              mingw-w64-clang-x86_64-cmake
              mingw-w64-clang-x86_64-ninja
              mingw-w64-clang-x86_64-git
            configure: |
              -G Ninja \
              -DCMAKE_C_COMPILER=clang \
              -DCMAKE_CXX_COMPILER=clang++ \
              -DENABLE_STATIC=ON \
              -DENABLE_HARDENING=ON \
              -DENABLE_LTO=ON

    steps:
      - name: Setup MSYS2
        if: ${{ matrix.config.shell == 'msys2 {0}' }}
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.config.msystem }}
          update: true
          install: ${{ matrix.config.msys2_packages }}

      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0   # Required so we can move and push tags

      - name: Install dependencies
        if: ${{ matrix.config.install }}
        run: ${{ matrix.config.install }}

      - name: Configure (Release)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.config.configure }}

      - name: Configure (Nightly)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: >-
          cmake
          -S .
          -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCPACK_PACKAGE_VERSION=nightly
          ${{ matrix.config.configure }}

      - name: Run Clang-Tidy
        if: ${{ matrix.config.package_name == 'linux_clang_x86_64' }}
        uses: cpp-linter/cpp-linter-action@v2
        id: cpp-linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 21
          step-summary: true
          files-changed-only: true
          style: file
          tidy-checks: ''
          database: 'build'

      - name: Build
        run: cmake --build build

      - name: Check static linking
        if: ${{ runner.os == 'Linux' }}
        run: file build/elfbsp | grep -Eq 'statically linked|static-pie linked'

      - name: Smoke test
        run: build/elfbsp --help > /dev/null

      - name: Package
        run: |
          cd build
          cpack

      - name: Extract Version Number (Release)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: echo "VERSION=${GITHUB_REF##*_}" >> $GITHUB_ENV

      - name: Extract Version Number (Development)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: echo "VERSION=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: elfbsp_${{ env.VERSION }}_${{ matrix.config.package_name }}
          path: ${{ matrix.config.artifact_path }}

  release:
    name: Publish
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          pattern: elfbsp_*
          merge-multiple: true
          path: dist

      - name: Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: ncipollo/release-action@v1
        with:
          name: ELFBSP ${{ github.ref_name }}
          bodyFile: CHANGELOG.md
          allowUpdates: true
          artifacts: dist/*.zip

      - name: Update Nightly Tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref == 'refs/heads/main' }}
        run: |
          git tag -d nightly || true
          git push origin :refs/tags/nightly || true
          git tag nightly HEAD
          git push origin nightly

      - name: Nightly Pre-Release
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.ref == 'refs/heads/main' }}
        uses: ncipollo/release-action@v1
        with:
          name: "[Nightly] ELFBSP ${{ github.sha }}"
          bodyFile: CHANGELOG.md
          tag: nightly
          commit: main
          prerelease: true
          allowUpdates: true
          artifacts: dist/*.zip
